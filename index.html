<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CN ARMORY - 中国武器数据库</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",sans-serif;
}


body{

background:#030712;
color:white;
overflow-x:hidden;

}


/* 背景光效 */

body::before{

content:"";

position:fixed;

width:500px;
height:500px;

background:#0077ff;

filter:blur(180px);

opacity:.25;

top:-200px;
left:50%;

transform:translateX(-50%);

}


/* 导航 */

nav{

height:75px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 8%;

background:#07101fdd;

backdrop-filter:blur(10px);

border-bottom:1px solid #1c3555;

}


.logo{

font-size:30px;

font-weight:bold;

color:#00d9ff;

letter-spacing:2px;

}



.menu span{

margin-left:30px;

color:#aaa;

cursor:pointer;

}


.menu span:hover{

color:#00d9ff;

}



/* 首页 */

.hero{

height:85vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

position:relative;

}



.hero h1{

font-size:72px;

letter-spacing:5px;

background:linear-gradient(
90deg,
#00eaff,
#ffffff,
#3b82f6
);

-webkit-background-clip:text;

color:transparent;

}



.hero p{

font-size:22px;

color:#9ca3af;

margin:30px 0;

}



.btn{

display:inline-block;

padding:16px 50px;

border-radius:40px;

background:#00d9ff;

color:#001018;

font-weight:bold;

cursor:pointer;

transition:.3s;

}


.btn:hover{

box-shadow:0 0 30px #00d9ff;

transform:scale(1.05);

}



/* 扫描圆 */

.radar{

position:absolute;

width:350px;

height:350px;

border-radius:50%;

border:1px solid #00d9ff33;

animation:scan 4s infinite linear;

}


@keyframes scan{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}



/* 分类 */

.section{

padding:60px 8%;

}



.title{

font-size:35px;

margin-bottom:30px;

}



.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:25px;

}



.card{

background:

linear-gradient(
145deg,
#101b33,
#08101f
);

padding:35px;

border-radius:20px;

border:1px solid #203452;

transition:.3s;

}



.card:hover{

transform:translateY(-12px);

border-color:#00d9ff;

box-shadow:
0 0 30px #00d9ff33;

}



.card h2{

color:#00d9ff;

margin-bottom:15px;

}



.card p{

color:#9ca3af;

line-height:1.7;

}



/* 数据 */

.stats{

display:flex;

justify-content:center;

gap:80px;

padding:70px 0;

}



.num{

font-size:45px;

color:#00d9ff;

text-align:center;

}



.stats p{

color:#aaa;

}



@media(max-width:700px){

.hero h1{

font-size:42px;

}


.menu{

display:none;

}


.stats{

gap:30px;

}

}


</style>

</head>


<body>


<nav>

<div class="logo">
CN ARMORY
</div>


<div class="menu">

<span>首页</span>

<span>装备库</span>

<span>科技树</span>

<span>关于</span>

</div>


</nav>



<section class="hero">


<div class="radar"></div>


<div>

<h1>
中国武器数据库
</h1>


<p>
探索航空 · 海军 · 导弹 · 航天装备体系
</p>


<div class="btn">
进入装备库
</div>


</div>


</section>



<section class="section">


<div class="title">
装备领域
</div>


<div class="cards">


<div class="card">

<h2>✈ 航空装备</h2>

<p>
战斗机、轰炸机、运输机、无人机体系。
</p>

</div>



<div class="card">

<h2>🚢 海军装备</h2>

<p>
航母、驱逐舰、潜艇与舰载武器。
</p>

</div>



<div class="card">

<h2>🚀 导弹系统</h2>

<p>
弹道、巡航、反舰、高超音速武器。
</p>

</div>



<div class="card">

<h2>🛰 航天科技</h2>

<p>
卫星、空间探索与未来技术。
</p>

</div>


</div>


</section>



<section class="stats">

<div>

<div class="num">
500+
</div>

<p>
装备资料
</p>

</div>


<div>

<div class="num">
70+
</div>

<p>
发展年份
</p>

</div>


<div>

<div class="num">
∞
</div>

<p>
未来扩展
</p>

</div>


</section>



</body>

</html>
