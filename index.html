<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>中国武器数据库</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",sans-serif;
}


body{

background:#111814;
color:white;
overflow-x:hidden;

}



/* 背景图片 */

.background{

position:fixed;

width:100%;
height:100%;

top:0;
left:0;

z-index:-2;

animation:bgchange 18s infinite;

background-size:cover;

background-position:center;

filter:brightness(45%);

}



@keyframes bgchange{

0%{
background-image:url("images/j20.jpg");
}

33%{
background-image:url("images/carrier.jpg");
}

66%{
background-image:url("images/rocket.jpg");
}

100%{
background-image:url("images/j20.jpg");
}

}



/* 顶部 */

header{

height:80px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 8%;

background:#111814cc;

border-bottom:1px solid #465548;

}



.logo{

font-size:30px;

font-weight:bold;

color:#d4d4b8;

}



.flag{

font-size:35px;

animation:wave 2s infinite;

}



@keyframes wave{

0%,100%{

transform:rotate(-5deg);

}

50%{

transform:rotate(5deg);

}

}



/* 主区域 */

.hero{

height:75vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

}



.hero h1{

font-size:60px;

letter-spacing:5px;

}



.hero p{

margin:25px;

font-size:20px;

color:#ddd;

}



/*按钮*/

.btn{

display:inline-block;

padding:16px 50px;

background:#596b45;

color:white;

text-decoration:none;

border-radius:8px;

transition:.3s;

position:relative;

z-index:5;

}



.btn:hover{

background:#758b58;

transform:translateY(-5px);

}



/* 数据 */

.stats{

display:flex;

justify-content:center;

gap:50px;

flex-wrap:wrap;

padding:40px;

}



.stat{

text-align:center;

background:#151d18cc;

padding:25px 40px;

border-radius:15px;

border:1px solid #465548;

}



.number{

font-size:40px;

color:#d4d4b8;

font-weight:bold;

}



/* 分类 */

.cards{

padding:50px 8%;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:25px;

}



.card{

background:#151d18dd;

padding:35px;

border-radius:15px;

border:1px solid #465548;

transition:.3s;

}



.card:hover{

transform:translateY(-10px);

background:#202b22;

}



.card h2{

margin-bottom:15px;

color:#d4d4b8;

}



.card p{

color:#ccc;

}



</style>

</head>



<body>


<div class="background"></div>



<header>

<div class="logo">
CN ARMORY
</div>


<div class="flag">
🇨🇳
</div>


</header>





<section class="hero">


<div>


<h1>
中国武器数据库
</h1>


<p>
探索航空 · 海军 · 导弹 · 航天装备体系
</p>


<a href="equipment.html" class="btn">
进入装备库
</a>


</div>


</section>





<section class="stats">


<div class="stat">

<div class="number" id="a">
0
</div>

<p>
装备领域
</p>

</div>



<div class="stat">

<div class="number" id="b">
0
</div>

<p>
武器体系
</p>

</div>



<div class="stat">

<div class="number" id="c">
0
</div>

<p>
发展年代
</p>

</div>


</section>





<section class="cards">


<div class="card">

<h2>
✈ 航空装备
</h2>

<p>
战斗机、轰炸机、无人机等航空力量。</p>

</div>




<div class="card">

<h2>
🚢 海军装备
</h2>

<p>
航母、驱逐舰、潜艇等海上装备。</p>

</div>





<div class="card">

<h2>
🚀 导弹系统
</h2>

<p>
弹道、巡航、反舰、高超音速体系。</p>

</div>





<div class="card">

<h2>
🛰 航天装备
</h2>

<p>
卫星、火箭与空间技术。</p>

</div>



</section>





<script>


function count(id,target){

let num=0;

let timer=setInterval(()=>{

num++;

document.getElementById(id).innerHTML=num;


if(num>=target){

clearInterval(timer);

}

},40);


}



count("a",4);

count("b",10);

count("c",70);



</script>


</body>

</html>
