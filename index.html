<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CN ARMORY 中国武器数据库</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",Arial,sans-serif;
}


body{

background:#080c09;
color:white;
overflow-x:hidden;

}


/* 背景 */

.bg{

position:fixed;

inset:0;

z-index:-5;

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.85)
),
url("images/background.jpg");

background-size:cover;

background-position:center;

animation:bgMove 25s infinite alternate;

}



@keyframes bgMove{

from{
transform:scale(1);
}

to{
transform:scale(1.1);
}

}



/* 经纬网格 */

.grid{

position:fixed;

inset:0;

z-index:-3;

background-image:

linear-gradient(
rgba(180,180,180,.08) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(180,180,180,.08) 1px,
transparent 1px
);

background-size:60px 60px;

animation:gridMove 15s linear infinite;

}



@keyframes gridMove{

from{
background-position:0 0;
}

to{
background-position:60px 60px;
}

}




/* 扫描线 */

.scan{

position:fixed;

width:100%;

height:2px;

background:#c8b96b;

opacity:.3;

animation:scan 6s infinite;

}



@keyframes scan{

0%{
top:0;
}

100%{
top:100%;
}

}




/* 顶部 */

header{

height:85px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 8%;

background:#0c110dcc;

border-bottom:1px solid #555;

}



.logo{

font-size:32px;

font-weight:bold;

letter-spacing:3px;

color:#d6c98a;

}



.status{

font-size:14px;

color:#aaa;

}



.status span{

color:#8cff8c;

}



/* 主区域 */

.hero{

height:70vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

}



.hero h1{

font-size:70px;

letter-spacing:10px;

animation:titleShow 2s;

}



@keyframes titleShow{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

}

}




.hero p{

margin:30px;

font-size:22px;

color:#ccc;

}



.btn{

display:inline-block;

padding:18px 60px;

background:#596b45;

border-radius:8px;

text-decoration:none;

color:white;

transition:.4s;

}



.btn:hover{

background:#82995f;

transform:scale(1.08);

}
/* 雷达 */

.radar{

position:absolute;

right:8%;

top:180px;

width:260px;

height:260px;

border-radius:50%;

border:1px solid #d6c98a55;

}


.radar::before{

content:"";

position:absolute;

width:100%;

height:100%;

border-radius:50%;

background:

conic-gradient(
transparent,
#d6c98a55,
transparent
);

animation:radar 4s linear infinite;

}


@keyframes radar{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}



.radar span{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

font-size:13px;

color:#d6c98a;

}




/* 数据面板 */


.panel{

position:absolute;

left:8%;

top:200px;

background:#101510cc;

border:1px solid #596b45;

padding:25px;

width:260px;

border-radius:12px;

}



.panel h3{

color:#d6c98a;

margin-bottom:15px;

}



.line{

margin:12px 0;

font-size:14px;

color:#bbb;

}



.light{

display:inline-block;

width:8px;

height:8px;

border-radius:50%;

background:#7cff7c;

margin-right:8px;

animation:blink 1.5s infinite;

}



@keyframes blink{

50%{

opacity:.3;

}

}




/* 数据统计 */


.stats{

display:flex;

justify-content:center;

gap:30px;

flex-wrap:wrap;

padding:40px 8%;

}



.stat{

background:#101510dd;

border:1px solid #596b45;

border-radius:15px;

padding:25px 45px;

text-align:center;

}



.number{

font-size:38px;

color:#d6c98a;

font-weight:bold;

}




/* 装备入口 */


.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(240px,1fr));

gap:25px;

padding:50px 8%;

}



.card{

background:#101510ee;

border:1px solid #596b45;

border-radius:15px;

padding:35px;

transition:.4s;

}



.card:hover{

transform:translateY(-12px);

border-color:#d6c98a;

box-shadow:
0 10px 30px #000;

}



.card h2{

color:#d6c98a;

margin-bottom:15px;

}



.card p{

color:#aaa;

}




/* 图片展示预留 */


.showcase{

margin:40px 8%;

height:220px;

border-radius:15px;

border:1px solid #596b45;

background:

linear-gradient(
90deg,
#101510,
transparent
),

url("images/equipment.jpg");

background-size:cover;

background-position:center;

display:flex;

align-items:center;

padding:40px;

}



.showcase h2{

font-size:35px;

}



</style>

</head>
