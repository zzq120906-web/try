<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>中国武器数据库</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei";
}


body{

background:#050914;
color:white;

}


/*导航*/

nav{

height:70px;
background:#081222;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 8%;

}


.logo{

font-size:28px;
color:#00d9ff;
font-weight:bold;

}


nav span{

margin-left:25px;
color:#aaa;

}



/*首页*/

.hero{

height:75vh;

display:flex;
justify-content:center;
align-items:center;

text-align:center;

background:
radial-gradient(circle,#005eff55,transparent 40%);

}


.hero h1{

font-size:65px;

background:linear-gradient(90deg,#00d9ff,#ffffff);

-webkit-background-clip:text;

color:transparent;

}



.hero p{

margin:25px;

font-size:20px;

color:#aaa;

}


button{

padding:15px 40px;

border:0;

border-radius:30px;

background:#00d9ff;

font-size:18px;

}



/*分类*/

.section{

padding:50px 8%;

}


.cards{

display:flex;

gap:25px;

flex-wrap:wrap;

}


.card{

background:#101b33;

border:1px solid #263a60;

border-radius:20px;

padding:30px;

flex:1;

min-width:250px;

transition:.3s;

}


.card:hover{

transform:translateY(-10px);

box-shadow:0 0 25px #00d9ff55;

}



.card h2{

color:#00d9ff;

margin-bottom:15px;

}



.card p{

color:#aaa;

}



</style>


</head>



<body>


<nav>

<div class="logo">
CN ARMORY
</div>


<div>

<span>首页</span>
<span>装备库</span>
<span>科技树</span>

</div>

</nav>



<section class="hero">


<div>

<h1>
中国武器数据库
</h1>


<p>
探索中国航空 · 海军 · 导弹 · 航天装备
</p>


<button>
进入装备库
</button>


</div>


</section>



<section class="section">


<h1>
装备分类
</h1>


<br>



<div class="cards">



<div class="card">

<h2>✈️ 航空装备</h2>

<p>
战斗机、轰炸机、运输机、无人机等航空系统。
</p>

</div>



<div class="card">

<h2>🚢 海军装备</h2>

<p>
航空母舰、驱逐舰、潜艇及舰载武器。
</p>

</div>




<div class="card">

<h2>🚀 导弹系统</h2>

<p>
弹道导弹、巡航导弹、高超音速武器。
</p>

</div>




<div class="card">

<h2>🛰️ 航天科技</h2>

<p>
卫星、空间探索与相关技术。
</p>

</div>



<div class="card">

<h2>🛡️ 防空系统</h2>

<p>
雷达、防空导弹、拦截系统。
</p>

</div>


</div>


</section>


</body>

</html>
