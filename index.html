<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CN ARMORY 中国武器数据库</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",sans-serif;
}


body{

background:#030712;
color:white;
overflow-x:hidden;

}



/* 背景光 */

body::before{

content:"";

position:fixed;

width:600px;
height:600px;

background:#0066ff;

filter:blur(180px);

opacity:.25;

top:-250px;
left:50%;

transform:translateX(-50%);

z-index:-1;

}



/* 导航 */

nav{

height:75px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 8%;

background:#07101fcc;

border-bottom:1px solid #203452;

}



.logo{

font-size:30px;

font-weight:bold;

color:#00d9ff;

}



.menu span{

margin-left:25px;

color:#aaa;

}



/* 主页面 */


.hero{

height:80vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

position:relative;

}




.hero h1{

font-size:65px;

letter-spacing:4px;

background:linear-gradient(
90deg,
#00d9ff,
white
);

-webkit-background-clip:text;

color:transparent;

}



.hero p{

margin:25px 0;

font-size:20px;

color:#aaa;

}



/* 真正按钮 */

.btn{


display:inline-block;

padding:16px 45px;

background:#00d9ff;

color:#001018;

border-radius:40px;

text-decoration:none;

font-weight:bold;


position:relative;

z-index:10;


transition:.3s;


}


.btn:hover{


transform:scale(1.08);

box-shadow:
0 0 30px #00d9ff;


}



/* 圆形科技动画 */


.circle{


position:absolute;

width:350px;

height:350px;

border-radius:50%;


border:1px solid #00d9ff55;


animation:rotate 8s linear infinite;


z-index:0;


}


@keyframes rotate{


from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}




.content{


padding:60px 8%;


}



.cards{


display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));


gap:25px;


}



.card{


background:#101b33;


border:1px solid #203452;


border-radius:20px;


padding:30px;


transition:.3s;


}



.card:hover{


transform:translateY(-10px);


border-color:#00d9ff;


}



.card h2{


color:#00d9ff;

margin-bottom:15px;


}



.card p{


color:#aaa;


}




@media(max-width:700px){


.hero h1{

font-size:40px;

}


.menu{

display:none;

}


}



</style>


</head>


<body>


<nav>


<div class="logo">
CN ARMORY
</div>


<div class="menu">

<span>首页</span>

<span>装备库</span>

<span>科技树</span>


</div>


</nav>





<section class="hero">


<div class="circle"></div>



<div style="position:relative;z-index:5;">


<h1>
中国武器数据库
</h1>


<p>
探索航空 · 海军 · 导弹 · 航天装备体系
</p>



<a href="equipment.html" class="btn">

进入装备库

</a>



</div>


</section>





<section class="content">


<h1>
装备领域
</h1>


<br>



<div class="cards">


<div class="card">

<h2>
✈ 航空装备
</h2>

<p>
战斗机、轰炸机、运输机、无人机
</p>

</div>



<div class="card">

<h2>
🚢 海军装备
</h2>

<p>
航母、驱逐舰、潜艇
</p>

</div>




<div class="card">

<h2>
🚀 导弹系统
</h2>

<p>
弹道、巡航、反舰、高超音速
</p>

</div>



</div>



</section>



</body>

</html>
