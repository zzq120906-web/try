<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA DATABASE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei",sans-serif;
}

body{
    background:#050816;
    color:white;
}

/* 顶部导航 */
nav{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 8%;
    background:#081020;
}

.logo{
    font-size:28px;
    color:#00eaff;
    font-weight:bold;
}

nav span{
    color:#aaa;
    margin-left:25px;
}


/* 首页 */
.hero{
    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
    radial-gradient(circle,#0066ff55,transparent 40%);
}


h1{
    font-size:70px;
    background:linear-gradient(90deg,#00eaff,#7b5cff);
    color:transparent;
    -webkit-background-clip:text;
}


.hero p{
    margin:30px;
    font-size:20px;
    color:#bbb;
}


button{
    padding:15px 40px;
    border:none;
    border-radius:30px;
    background:#00eaff;
    font-size:18px;
    cursor:pointer;
}


/* 卡片 */

.section{
    padding:50px 8%;
}


.cards{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}


.card{
    flex:1;
    min-width:250px;
    background:#111b33;
    padding:30px;
    border-radius:20px;
    border:1px solid #23365c;
    transition:.3s;
}


.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 30px #00eaff66;
}


.card h2{
    color:#00eaff;
    margin-bottom:15px;
}


.card p{
    color:#aaa;
}



/* 数据 */

.data{
    display:flex;
    justify-content:center;
    gap:80px;
    padding:50px;
}


.num{
    font-size:45px;
    color:#00eaff;
}


</style>

</head>


<body>


<nav>

<div class="logo">
NOVA
</div>

<div>
<span>首页</span>
<span>数据库</span>
<span>项目</span>
</div>

</nav>



<section class="hero">

<div>

<h1>
未来科技数据库
</h1>

<p>
探索 AI · 航天 · 能源 · 未知科技
</p>

<button>
进入数据库
</button>

</div>

</section>



<section class="section">

<h2>
核心领域
</h2>

<br>


<div class="cards">


<div class="card">
<h2>🤖 人工智能</h2>
<p>
下一代智能系统，改变未来世界。
</p>
</div>


<div class="card">
<h2>🚀 航天探索</h2>
<p>
探索深空，寻找未知文明。
</p>
</div>


<div class="card">
<h2>⚡ 新能源</h2>
<p>
构建未来能源体系。
</p>
</div>


</div>

</section>



<section class="data">

<div>
<div class="num">128</div>
项目
</div>


<div>
<div class="num">42</div>
团队
</div>


<div>
<div class="num">99%</div>
完成
</div>


</section>


</body>
</html>
