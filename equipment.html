<style>

*{
margin:0;
padding:0;
box-sizing:border-box;

body{

}


header{

height:80px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 8%;

background:#07101f;

border-bottom:1px solid #203452;

}


.logo{

}


header a{

}

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

}



.card{

background:#101b33;

padding:35px;

border-radius:20px;

border:1px solid #203452;

.card:hover{

}



.card h2{

margin-bottom:20px;

}



.card p{

line-height:1.8;

}



</style>

</head>
