<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>导弹数据库 - CN ARMORY</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",sans-serif;
}


body{

background:#030712;
color:white;

}



header{

height:80px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 8%;

background:#07101f;

border-bottom:1px solid #203452;

}


.logo{

font-size:30px;
font-weight:bold;
color:#00d9ff;

}


header a{

color:#aaa;
text-decoration:none;

}



.container{

padding:60px 8%;

}



.title{

font-size:50px;
color:#00d9ff;

}


.subtitle{

margin-top:15px;
color:#aaa;

}



.search{

margin:40px 0;

}



.search input{

width:100%;
max-width:500px;

padding:15px 20px;

border-radius:30px;

border:1px solid #203452;

background:#101b33;

color:white;

font-size:16px;

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:30px;

}



.card{

display:block;

text-decoration:none;

color:white;

background:
linear-gradient(
145deg,
#101b33,
#060b18
);

padding:35px;

border-radius:20px;

border:1px solid #203452;

transition:.3s;

}



.card:hover{

transform:translateY(-10px);

border-color:#00d9ff;

box-shadow:
0 0 30px #00d9ff55;

}



.card h2{

color:#00d9ff;

margin-bottom:15px;

}


.card p{

color:#aaa;

line-height:1.7;

}


.tag{

display:inline-block;

margin-top:20px;

padding:6px 15px;

border-radius:20px;

background:#00d9ff22;

color:#00d9ff;

}



.list{

margin-top:60px;

}


.item{

background:#101b33;

padding:20px;

margin-top:15px;

border-radius:15px;

border:1px solid #203452;

}



.name{

color:#00d9ff;

font-size:22px;

}



.info{

color:#aaa;

margin-top:8px;

}


</style>


</head>



<body>



<header>


<div class="logo">
CN ARMORY
</div>


<a href="equipment.html">
返回装备库
</a>


</header>




<div class="container">


<h1 class="title">
🚀 导弹数据库
</h1>


<p class="subtitle">
探索中国导弹体系 · 型号发展 · 技术方向
</p>



<div class="search">

<input 
id="search"
placeholder="搜索导弹名称..."
onkeyup="searchMissile()">

</div>





<div class="grid">



<a href="ballistic.html" class="card">

<h2>
🛰 弹道导弹
</h2>

<p>
战略打击体系，包括近程、中程、远程弹道导弹。
</p>

<div class="tag">
战略力量
</div>

</a>




<a href="anti_ship.html" class="card">

<h2>
⚓ 反舰导弹
</h2>

<p>
用于海上目标打击的导弹体系。
</p>

<div class="tag">
海上作战
</div>

</a>





<a href="cruise.html" class="card">

<h2>
🛩 巡航导弹
</h2>

<p>
远程精确打击与复杂环境作战。
</p>

<div class="tag">
精确打击
</div>

</a>





<a href="hypersonic.html" class="card">

<h2>
🔥 高超音速
</h2>

<p>
高速飞行与先进气动技术方向。
</p>

<div class="tag">
未来技术
</div>

</a>



</div>






<div class="list">


<h1>
热门装备
</h1>



<div class="item missile">

<div class="name">
东风系列
</div>

<div class="info">
中国弹道导弹体系代表
</div>

</div>



<div class="item missile">

<div class="name">
鹰击系列
</div>

<div class="info">
反舰导弹体系代表
</div>

</div>



<div class="item missile">

<div class="name">
长剑系列
</div>

<div class="info">
巡航导弹体系
</div>

</div>



<div class="item missile">

<div class="name">
红旗系列
</div>

<div class="info">
防空导弹体系
</div>

</div>



</div>



</div>






<script>


function searchMissile(){


let input=
document.getElementById("search")
.value
.toLowerCase();



let items=
document.getElementsByClassName("missile");



for(let i=0;i<items.length;i++){


let text=
items[i].innerText
.toLowerCase();



if(text.includes(input)){

items[i].style.display="block";

}

else{

items[i].style.display="none";

}


}


}


</script>




</body>

</html>
